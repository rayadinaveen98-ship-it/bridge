name: Bridge B3c-2R2 actual 0008 signed-role PG18 disposable proof
on:
  pull_request:
    paths:
      - '.github/workflows/bridge-actual-schema-pg18.yml'
      - 'apps/api/tests/v2/privileges/b3c2r2_*.mjs'
      - 'apps/api/package.json'
      - 'docs/engineering/V2_06B_B3C2R2_*.md'
      - 'docs/ROADMAP.md'
  push:
    paths:
      - '.github/workflows/bridge-actual-schema-pg18.yml'
      - 'apps/api/tests/v2/privileges/b3c2r2_*.mjs'
      - 'apps/api/package.json'
      - 'docs/engineering/V2_06B_B3C2R2_*.md'
      - 'docs/ROADMAP.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-schema-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bridge_privproof_admin
          POSTGRES_PASSWORD: bridge_privproof_only
          POSTGRES_DB: bridge_privproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_privproof_admin -d bridge_privproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRIDGE_B3C2R2_TEST_DATABASE_URL: postgresql://bridge_privproof_admin:bridge_privproof_only@127.0.0.1:5432/bridge_privproof
      BRIDGE_B3C2R2_ACK: disposable-actual-0008-pg18-only
      BRIDGE_B3C2R2_PG_MAJOR: '18'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated backend PG client
        run: npm install --prefix apps/api --no-package-lock --no-audit --no-fund
      - name: Prove real checked-in 0001-0008 PG18 schema and test-only JWT/HMAC scoped nonowner access
        run: npm run test:v2:pg18-signed-rls --prefix apps/api
