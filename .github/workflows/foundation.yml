name: Foundation checks
on:
  push:
  pull_request:
jobs:
  matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Matching-domain unit tests
        run: npm test --prefix packages/matching
      - name: Backend HTTP, auth and fake-Postgres tests
        run: npm test --prefix apps/api
      - name: V2-01 reference-contract tests (NOT runtime enforcement)
        run: npm run test:v2:contracts --prefix apps/api
      - name: V2-02 actual policy kernel tests (NOT route enforcement)
        run: npm run test:policy --prefix apps/api
      - name: V2-04A pure random-session clock tests (NOT live enforcement)
        run: npm run test:v2:sessions --prefix apps/api
      - name: V2-05A pure mutual Keep and direct segment tests (NOT live)
        run: |
          npm run test:v2:connections --prefix apps/api
          npm run test:v2:direct --prefix apps/api
      - name: V2-06A pure scoped messaging and unread tests (NOT LIVE)
        run: npm run test:v2:messaging --prefix apps/api
      - name: B1b disconnected synthetic-only AEAD and in-memory key contract tests (NOT LIVE)
        run: npm run test:v2:private-crypto --prefix apps/api
      - name: B3a disconnected pure V1-V2 route firewall and safe response contracts (NOT LIVE)
        run: npm run test:v2:compatibility --prefix apps/api
      - name: B3b-1 isolated ephemeral RS256 JWT negative tests (NO HOSTED IDENTITY)
        run: npm run test:v2:identity --prefix apps/api
      - name: Validate design token JSON
        run: node -e "const t=require('./design/tokens/bridge.v1.json'); if (!t.color?.dark || !t.spacing) process.exit(1)"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridge_test
          POSTGRES_PASSWORD: bridge_test_only
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_test -d bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRIDGE_TEST_DATABASE_URL: postgresql://bridge_test:bridge_test_only@127.0.0.1:5432/bridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations in isolated test database
        run: |
          psql "$BRIDGE_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/migrations/0001_bridge_foundation.sql
          psql "$BRIDGE_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/migrations/0002_message_outbox.sql
          psql "$BRIDGE_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/migrations/0003_lab_credentials.sql
      - name: Install server database driver
        run: npm install --prefix apps/api --no-package-lock --no-audit --no-fund
      - name: V2-03 expand-only migration rehearsal (disposable bridge_test)
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:migrations --prefix apps/api
      - name: V2-03 disposable database backup and restore certification
        run: |
          set -euo pipefail
          # Use the PG16 tools belonging to this job's disposable PG16 service.
          # Host-side pg_restore can be newer and emit unsupported settings.
          mapfile -t db_containers < <(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}')
          test "${#db_containers[@]}" -eq 1
          SERVICE_DB="${db_containers[0]}"
          docker exec "$SERVICE_DB" pg_dump -U bridge_test -d bridge_test -Fc > "$RUNNER_TEMP/bridge_v2_disposable.dump"
          docker exec "$SERVICE_DB" createdb -U bridge_test bridge_restore_test
          docker exec -i "$SERVICE_DB" pg_restore -U bridge_test -d bridge_restore_test --no-owner --no-acl < "$RUNNER_TEMP/bridge_v2_disposable.dump"
          test "$(docker exec "$SERVICE_DB" psql -U bridge_test -d bridge_restore_test -X -Atc "SELECT count(*) FROM bridge_schema_migrations")" = "4"
          test "$(docker exec "$SERVICE_DB" psql -U bridge_test -d bridge_restore_test -X -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'bridge_%'")" = "34"
          test "$(docker exec "$SERVICE_DB" psql -U bridge_test -d bridge_restore_test -X -Atc "SELECT count(*) FROM bridge_messages WHERE body LIKE 'Synthetic fixture %'")" = "4"
          test "$(docker exec "$SERVICE_DB" psql -U bridge_test -d bridge_restore_test -X -Atc "SELECT count(*) FROM bridge_active_match_slots")" = "2"
          docker exec "$SERVICE_DB" dropdb -U bridge_test bridge_restore_test
      - name: Run full API suite against disposable PostgreSQL
        run: npm test --prefix apps/api
      - name: V2-04A isolated random lifecycle and DB-lock race tests
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:sessions:db --prefix apps/api
      - name: V2-05A disconnected bilateral Keep/withdraw/race tests
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:connections:db --prefix apps/api
      - name: V2-05A disconnected free-direct-session lifecycle tests
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:direct:db --prefix apps/api
      - name: V2-06A synthetic-only scoped metadata/unread PG16 tests
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:messaging:db --prefix apps/api
      - name: B1a disconnected V2-only 0008 schema, constraints, default-deny RLS and PG16 backup/restore
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:private-schema --prefix apps/api

      - name: B2a disconnected encrypted atomic accepts, lock races, rollback (PG16 synthetic ONLY)
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:private-accept:db --prefix apps/api
      - name: B2b disconnected current LIVE, recipient UNREAD, bounded ack and recovery PG16 tests (NOT LIVE)
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:private-delivery:db --prefix apps/api
      - name: B3b-1 signed synthetic actor mapping, PG16 account locks and JWT expiry races (NOT LIVE)
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:identity:db --prefix apps/api
      - name: B3b-2 disconnected signed-actor and private-message single-transaction PG16 tests (NOT LIVE)
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
        run: npm run test:v2:atomic-private:db --prefix apps/api
      - name: B3c-1 disposable PG16 independent-login privilege and RLS denial tests (NOT HOSTED)
        env:
          BRIDGE_TEST_MIGRATION_ACK: disposable-bridge_test-only
          BRIDGE_B3C1_ROLE_TEST_ACK: disposable-pg16-service-role-ddl
        run: npm run test:v2:privileges:db --prefix apps/api
