name: Foundation checks
on:
  push:
  pull_request:
jobs:
  matching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Matching-domain unit tests
        run: npm test --prefix packages/matching
      - name: Backend HTTP, auth and fake-Postgres tests
        run: npm test --prefix apps/api
      - name: Validate design token JSON
        run: node -e "const t=require('./design/tokens/bridge.v1.json'); if (!t.color?.dark || !t.spacing) process.exit(1)"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridge_test
          POSTGRES_PASSWORD: bridge_test_only
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_test -d bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRIDGE_TEST_DATABASE_URL: postgresql://bridge_test:bridge_test_only@127.0.0.1:5432/bridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration in isolated test database
        run: psql "$BRIDGE_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/migrations/0001_bridge_foundation.sql
      - name: Install server database driver
        run: npm install --prefix apps/api --no-package-lock --no-audit --no-fund
      - name: Run full API suite against disposable PostgreSQL
        run: npm test --prefix apps/api
