name: Bridge B3c-2R3B-2A disposable PG18 trust boundary
on:
  pull_request:
    paths:
      - 'apps/api/tests/v2/trust_boundary/**'
      - 'apps/api/package.json'
      - '.github/workflows/bridge-trust-boundary-pg18.yml'
      - 'docs/engineering/V2_06B_B3C2R3B2A_EVIDENCE.md'
  push:
    paths:
      - 'apps/api/tests/v2/trust_boundary/**'
      - 'apps/api/package.json'
      - '.github/workflows/bridge-trust-boundary-pg18.yml'
      - 'docs/engineering/V2_06B_B3C2R3B2A_EVIDENCE.md'
permissions:
  contents: read
jobs:
  restricted-roles-pg18:
    name: Actual 0008 independent LOGIN, adversarial capability and V1 gap controls
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bridge_privproof_admin
          POSTGRES_PASSWORD: bridge_privproof_only
          POSTGRES_DB: bridge_privproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_privproof_admin -d bridge_privproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      BRIDGE_B3C2R2_ACK: disposable-actual-0008-pg18-only
      BRIDGE_B3C2R2_PG_MAJOR: '18'
      BRIDGE_B3C2R2_TEST_DATABASE_URL: postgresql://bridge_privproof_admin:bridge_privproof_only@127.0.0.1:5432/bridge_privproof
      BRIDGE_B3C2R3B2A_ACK: bridge-b3c2r3b2a-disposable-only
      BRIDGE_B3C2R3B2A_PG_MAJOR: '18'
      BRIDGE_B3C2R3B2A_TEST_DATABASE_URL: postgresql://bridge_privproof_admin:bridge_privproof_only@127.0.0.1:5432/bridge_privproof
    steps:
      - name: Checkout exact PR source; no external credentials
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client dependency (disposable only)
        run: npm install --prefix apps/api --no-package-lock --no-audit --no-fund
      - name: Run attested actual 0001..0008 PG18 trust-boundary proof
        run: timeout --signal=TERM --kill-after=10s 140s npm run test:v2:trust-boundary:pg18 --prefix apps/api
